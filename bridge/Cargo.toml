[package]
name = "tnd-bridge"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "tnd-bridge"
path = "src/main.rs"

[dependencies]
tnd-dsp-core = { path = "../dsp-core" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
tungstenite = "=0.24.0"
uuid = { version = "=1.18.1", features = ["v4"] }
